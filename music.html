<!DOCTYPE html>
<html>
<head>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (query) {
                const encodedQuery = encodeURIComponent(query);
                const url1 = `https://ru.hitmoz.org/search?q=${encodedQuery}`;
                const url2 = `https://skysound7.com/search?q=${encodedQuery}`;
				const url3 = `https://web.ligaudio.ru/mp3/${encodedQuery}`;
				const url4 = `https://music.yandex.ru/search?text=${encodedQuery}`
				const url5 = `https://open.spotify.com/search/${encodedQuery}`;
				const url6 = `https://google.com/search/?q=${encodedQuery}&tbm=isch`;
				const url7 = `https://yandex.ru/images/search?text=${encodedQuery}`;
				window.open(url1, '_blank');
                window.open(url2, '_blank');
				window.open(url3, '_blank');
				window.open(url4, '_blank');
				window.open(url5, '_blank');
				window.open(url6, '_blank');
				window.open(url7, '_blank');
            }
        };
    </script>
</head>
<body></body>
</html>
